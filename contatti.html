  <main>
    <h1>Contatti</h1>
    <p>Scrivici per informazioni sui prodotti, appuntamenti o richieste specifiche.</p>

    <form action="https://formspree.io/f/INSERISCI_IL_TUO_ID" method="POST" class="contact-form">
      <label>
        Nome
        <input type="text" name="nome" required>
      </label>
      <label>
        Email
        <input type="email" name="email" required>
      </label>
      <label>
        Messaggio
        <textarea name="messaggio" rows="5" required></textarea>
      </label>
      <button type="submit" class="btn">Invia</button>
    </form>

    <p style="margin-top: 2rem;">
      Oppure scrivi a <a href="mailto:info@amatteroftone.com">info@amatteroftone.com</a>.
    </p>
